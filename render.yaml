# CrowdCloud deployment on Render (free tier)
# One-click deploy: render.com/new → "Existing Git repository" → this repo.
# Render reads this blueprint automatically (render.com/docs/blueprint-spec).

services:
  - type: web
    name: crowdcloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 4 --threads 2 --bind 0.0.0.0:$PORT --timeout 60 run:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: CROWDCLOUD_DB
        value: /opt/render/project/src/database/crowdcloud.db
      - key: BUSY_THRESHOLD
        value: 8
      - key: HIGH_THRESHOLD
        value: 16
      - key: AUTO_SERVE
        value: 0
