# nginx reverse proxy for the CrowdCloud scaling demo.
# `web` resolves (round-robin) to all replicas of the crowdcloud web service.

upstream crowdcloud_app {
    server web:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://crowdcloud_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
